name: tw_food
description: "Aplikasi pelanggan TWFood."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^13.4.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  video_player: ^2.10.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/jamur_hias.png

  # Font Plus Jakarta Sans (file ada di assets/fonts/).
  # Nama family harus sama dengan AppTextStyles.fontFamily.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800